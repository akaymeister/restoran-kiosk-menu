name: Kiosk APK Derleyici

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # İstediğiniz an tek tıkla elle başlatabilmeniz için

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu İndir
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'

    - name: Çalıştırma İzni Ver
      run: chmod +x gradlew

    - name: APK Derle (assembleDebug)
      run: ./gradlew assembleDebug --stacktrace

    - name: APK Dosyasını İndirilebilir Yap
      uses: actions/upload-artifact@v4
      with:
        name: restoran-kiosk-menu-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
